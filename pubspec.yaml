    # خط Lalezar
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar/Lalezar-Regular.ttf

    # خط Lemonada
    - family: Lemonada
      fonts:
        - asset: assets/fonts/Lemonada/Lemonada-Regular.ttf
        - asset: assets/fonts/Lemonada/Lemonada-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lemonada/Lemonada-Light.ttf
          weight: 300
        - asset: assets/fonts/Lemonada/Lemonada-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lemonada/Lemonada-SemiBold.ttf
          weight: 600

    # خط Almarai
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai/Almarai-ExtraBold.ttf
          weight: 800




